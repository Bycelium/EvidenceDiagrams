:root {
  color-scheme: light;
  font: 16px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #172033;
  background: #fff;
  accent-color: #64748b;
}

* {
  box-sizing: border-box;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

body {
  margin: 0;
}

@media (min-width: 621px) {
  :root { scrollbar-gutter: stable; }
}

button,
input {
  font: inherit;
}

main {
  width: min(760px, calc(100% - 1rem));
  margin: 0 auto;
  padding: .75rem 0 2rem;
}

h1,
h2,
p {
  margin-top: 0;
}

h1 {
  margin-bottom: .2rem;
  font-size: clamp(1.6rem, 4vw, 2.15rem);
  line-height: 1.05;
  letter-spacing: -.04em;
}

h2 {
  margin-bottom: 0;
  font-size: 1.3rem;
}

.introduction {
  max-width: 700px;
  margin-bottom: .6rem;
}

.introduction > p:last-child {
  margin-bottom: 0;
  font-size: .85rem;
}

.eyebrow {
  margin-bottom: .2rem;
  color: #476078;
  font-size: .72rem;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.prior-handle {
  position: absolute;
  z-index: 5;
  top: 0;
  width: 1.9rem;
  height: 1.9rem;
  min-height: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  cursor: ew-resize;
  transform: none;
  touch-action: none;
}

.prior-handle:hover,
.prior-handle:active {
  background: transparent;
}

.prior-handle:focus-visible {
  outline: 2px solid #0f172a;
  outline-offset: -2px;
  background: transparent;
}

.prior-handle::before {
  position: absolute;
  top: 4px;
  width: 9px;
  height: 22px;
  border: 0 solid var(--prior-color, #0f172a);
  content: '';
}

.prior-handle::after {
  position: absolute;
  top: 6px;
  width: 10px;
  height: 18px;
  border: 1px solid color-mix(in srgb, var(--prior-color, #0f172a) 35%, transparent);
  border-radius: 4px;
  background-color: rgb(248 250 252 / 80%);
  background-image:
    radial-gradient(circle at 35% 28%, var(--prior-color, #0f172a) 0 1px, transparent 1.5px),
    radial-gradient(circle at 65% 28%, var(--prior-color, #0f172a) 0 1px, transparent 1.5px),
    radial-gradient(circle at 35% 50%, var(--prior-color, #0f172a) 0 1px, transparent 1.5px),
    radial-gradient(circle at 65% 50%, var(--prior-color, #0f172a) 0 1px, transparent 1.5px),
    radial-gradient(circle at 35% 72%, var(--prior-color, #0f172a) 0 1px, transparent 1.5px),
    radial-gradient(circle at 65% 72%, var(--prior-color, #0f172a) 0 1px, transparent 1.5px);
  content: '';
}

.prior-handle-min::before {
  left: var(--prior-anchor, 50%);
  border-top-width: 2px;
  border-bottom-width: 2px;
  border-left-width: 2px;
}

.prior-handle-max::before {
  left: calc(var(--prior-anchor, 50%) - 9px);
  border-top-width: 2px;
  border-right-width: 2px;
  border-bottom-width: 2px;
}

.prior-handle-min::after { left: calc(var(--prior-anchor, 50%) - 15px); }
.prior-handle-max::after { left: calc(var(--prior-anchor, 50%) + 5px); }

.prior-handle:hover::after,
.prior-handle:active::after,
.prior-handle:focus-visible::after {
  border-color: var(--prior-color, #0f172a);
  background-color: #fff;
  box-shadow: 0 1px 3px rgb(15 23 42 / 18%);
}

button {
  min-height: 2.45rem;
  padding: .48rem .72rem;
  border: 1px solid #b9c5d2;
  border-radius: 8px;
  color: #1f3147;
  background: #f8fafc;
  font-weight: 650;
  cursor: pointer;
}

button:hover {
  border-color: #7b8fa4;
  background: #eef3f7;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 3px solid #cbd5e1;
  outline-offset: 2px;
}
.inquiry-introduction {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: none;
}
.inquiry-introduction .language-control { position: relative; order: 2; margin-left: 1rem; }
.language-menu-button { display: inline-flex; align-items: center; gap: .3rem; min-height: 2rem; padding: .25rem .45rem; border: 1px solid #cbd5e1; border-radius: 999px; color: #1f3147; background: #fff; font-weight: 800; }
.language-menu-button svg { width: 1rem; height: 1rem; fill: none; stroke: currentColor; stroke-width: 1.7; }
.language-menu { position: absolute; z-index: 20; top: calc(100% + .25rem); right: 0; display: grid; min-width: 5rem; padding: .25rem; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; box-shadow: 0 8px 18px rgb(15 23 42 / 16%); }
.language-menu[hidden] { display: none; }
.language-menu button { padding: .35rem .5rem; border: 0; border-radius: 5px; background: transparent; color: #1f3147; font-weight: 750; text-align: left; }
.language-menu button[aria-checked="true"] { background: #e2e8f0; }

.collapsed-evidence-summary {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  grid-template-rows: auto 1rem;
  align-items: center;
  gap: .2rem 1rem;
  min-width: 0;
  padding: .45rem .6rem;
  border: 1px solid #d5dde7;
  border-radius: 9px;
  background: #f8fafc;
}

.collapsed-evidence-summary-total {
  display: grid;
  gap: .05rem;
  min-width: 0;
  font-size: .72rem;
  line-height: 1.2;
}

.collapsed-evidence-summary-total.is-opposition { grid-column: 1; grid-row: 1; text-align: left; color: #b91c1c; }
.collapsed-evidence-summary-total.is-dissonance { grid-column: 2; grid-row: 1; text-align: center; color: #a16207; }
.collapsed-evidence-summary-total.is-dissonance.is-zero { color: #526478; }
.collapsed-evidence-summary-total.is-support { grid-column: 3; grid-row: 1; text-align: right; color: #15803d; }
.collapsed-evidence-summary-label { color: #526478; font-weight: 700; }
.collapsed-evidence-summary-value { font-variant-numeric: tabular-nums; font-weight: 850; }

.collapsed-evidence-summary-line {
  display: grid;
  grid-column: 1 / -1;
  grid-row: 2;
  grid-template-columns: 1fr 1px 1fr;
  align-items: center;
  height: 1rem;
}

.collapsed-evidence-summary-arrow {
  display: flex;
  align-items: center;
  height: 1rem;
}
.collapsed-evidence-summary-arrow[hidden] { display: none; }
.collapsed-evidence-summary-arrow.is-opposition {
  justify-self: end;
  width: var(--collapsed-opposition);
  color: #ef4444;
}
.collapsed-evidence-summary-arrow.is-support {
  grid-column: 3;
  justify-self: start;
  width: var(--collapsed-support);
  color: #22c55e;
}
.collapsed-evidence-summary-arrow-body {
  flex: 1 1 auto;
  height: auto;
  max-height: 4px;
  aspect-ratio: 4 / 1;
  background: currentcolor;
}
.collapsed-evidence-summary-arrow-tip {
  flex: 0 0 min(.45rem, 40%);
  width: min(.45rem, 40%);
  height: auto;
  aspect-ratio: 1;
  background: currentcolor;
}
.collapsed-evidence-summary-arrow.is-opposition .collapsed-evidence-summary-arrow-tip {
  clip-path: polygon(100% 0, 0 50%, 100% 100%);
}
.collapsed-evidence-summary-arrow.is-support .collapsed-evidence-summary-arrow-tip {
  clip-path: polygon(0 0, 100% 50%, 0 100%);
}
.collapsed-evidence-summary-center { grid-column: 2; grid-row: 1; width: 1px; height: 1rem; background: #334155; }

@media (max-width: 420px) {
  .collapsed-evidence-summary { gap: .15rem .5rem; padding-inline: .45rem; }
  .collapsed-evidence-summary-label { font-size: .66rem; }
}

@media (max-width: 520px) {
  main {
    width: calc(100% - .7rem);
    padding: .6rem 0 1.5rem;
  }
}

@media (prefers-reduced-motion: no-preference) {
  button {
    transition: background-color .15s, border-color .15s, box-shadow .15s;
  }
}

.inquiry-mode {
  display: grid;
  min-width: 0;
  gap: .65rem;
  align-items: start;
}

main.inquiry-page { width: min(860px, calc(100% - 1rem)); }

.inquiry-mode > *,
.inquiry-toolbar > *,
.inquiry-focus-heading > * {
  min-width: 0;
}

.inquiry-toolbar,
.inquiry-focus {
  border: 1px solid #d5dde7;
  border-radius: 16px;
  background: #fff;
  box-shadow: 0 8px 24px rgb(38 52 69 / 5%);
}

.inquiry-toolbar {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 1rem;
  padding: .35rem .15rem .55rem;
  border: 0;
  border-radius: 0;
  box-shadow: none;
}

.inquiry-toolbar h1,
.inquiry-toolbar p,
.inquiry-focus h2 {
  margin: 0;
}

.inquiry-toolbar-actions {
  display: flex;
  align-items: end;
  gap: .4rem;
}

.inquiry-root-list { display: grid; gap: .45rem; }
.inquiry-root-add { width: 100%; }
.inquiry-root-add > button { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 2.75rem; gap: .45rem; padding: .35rem .75rem; border: 2px dashed #94a3b8; border-radius: 0; color: #475569; background: rgb(248 250 252 / 72%); font-size: .8rem; font-weight: 750; text-align: center; }
.inquiry-root-add > button:hover { border-color: #64748b; color: #1f3147; background: #eef3f7; }
.inquiry-root-add > button:focus-visible { outline: 2px solid #334155; outline-offset: -4px; }
.inquiry-root-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; width: 100%; min-height: 2.75rem; gap: .65rem; padding: .45rem .65rem; border: 1px solid #d5dde7; border-radius: 9px; text-align: left; }
.inquiry-root-card:hover { background: color-mix(in srgb, var(--result-color, #9ca3af) 28%, white); }
.inquiry-root-card:focus-visible { outline: 2px solid #334155; outline-offset: -2px; }
.inquiry-root-card-title { min-width: 0; overflow-wrap: anywhere; font-size: .88rem; font-weight: 750; line-height: 1.25; }
.inquiry-root-card .inquiry-current-label { display: none; }
.inquiry-root-card .inquiry-current-credibility { justify-self: end; }

      });
      let newPremiseDraft = { title: "", description: "" };
      let usingExistingPremise = false;
      premiseSelect.addEventListener("change", () => {
        const creating = premiseSelect.value === "";

    function openAddRootDialog() {

    function openSourceDialog(evidenceId) {

    function resetActiveRoot() {

      } else {

    saturationThreshold.value = String(saturationThresholdDecibans);

    $("#inquiry-reset").addEventListener("click", resetActiveRoot);
    $("#inquiry-dialog-cancel").addEventListener("click", closeDialog);

    dialog.addEventListener("cancel", () => {

    focus.addEventListener("pointerdown", (event) => {

      const track = handle.closest(".inquiry-flow-axis-track");
      const bounds = track.getBoundingClientRect();
      const claim2 = claimById2(session.inquiry, session.focusClaimId);
      priorDrag = {
        pointerId: event.pointerId,

        startX: event.clientX,
        startValue: gaussianToBand(claim2.prior)[handle.dataset.priorBound],

        restorePriorDrag();
        priorDrag.lastValue = priorDrag.startValue;
        event.preventDefault();
        return;
      }
      const delta = (event.clientX - priorDrag.startX) / priorDrag.width * (priorDrag.maximum - priorDrag.minimum);
      const next = Math.round(priorDrag.startValue + delta);
      if (next === priorDrag.lastValue) return;
      priorDrag.moved = true;
      priorDrag.lastValue = next;
      commitPriorEndpoint(priorDrag.bound, next, priorDrag);
      event.preventDefault();

    document.addEventListener("pointerup", (event) => {
      if (priorDrag?.pointerId !== event.pointerId) return;
      if (focus.hasPointerCapture(event.pointerId)) focus.releasePointerCapture(event.pointerId);
      priorDrag = void 0;
    });
    document.addEventListener("pointercancel", (event) => {
      if (priorDrag?.pointerId !== event.pointerId) return;

      if (focus.hasPointerCapture(event.pointerId)) focus.releasePointerCapture(event.pointerId);
      priorDrag = void 0;
    });
    focus.addEventListener("click", (event) => {

      if (!button) return;
      const { action } = button.dataset;
      if (action === "add-evidence") openAddDialog();
      else if (action === "inspect-evidence") openEvidencePanel(button.dataset.evidenceId);

        const restoreFocus = document.activeElement === button;

    rootList.addEventListener("click", (event) => {

      render();

    resetActiveRoot();
    return {
      setLocale() {
        const previousPreset = createInquiryPreset(activePresetId, renderedLocale);
        const localizedPreset = createInquiryPreset(activePresetId, i18n2.locale);
        for (const [rootId, rootSession] of rootSessions) {
          if (rootId !== presetRootId) continue;
          for (const claim2 of rootSession.inquiry.claims) {
            const previous = claimById2(previousPreset, claim2.id);
            const localized = claimById2(localizedPreset, claim2.id);
            if (previous && localized && claim2.title === previous.title) claim2.title = localized.title;
            if (previous && localized && claim2.description === previous.description) claim2.description = localized.description;
          }
          for (const source of rootSession.inquiry.contributions) {
            const previous = contributionById2(previousPreset, source.id);
            const localized = contributionById2(localizedPreset, source.id);
            if (previous && localized && source.title === previous.title) source.title = localized.title;
            if (previous && localized && source.locator === previous.locator) source.locator = localized.locator;
            if (previous && localized && source.url === previous.url) {
              if (localized.url === void 0) delete source.url;
              else source.url = localized.url;
            }

        }
        renderedLocale = i18n2.locale;
        saturationThresholdValue.textContent = i18n2.number(saturationThresholdDecibans);

  }
