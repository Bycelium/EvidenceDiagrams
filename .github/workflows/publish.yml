name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.3.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted publishing support
        run: npm install --global npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - name: Select and verify release package
        id: release-package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/release-package.mjs --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
      - run: pnpm check
      - name: Pack selected package
        run: pnpm --filter '${{ steps.release-package.outputs.package_name }}' pack --out "$RUNNER_TEMP/release.tgz"
      - name: Check whether selected archive is already published
        id: published-release
        run: node scripts/check-published-release.mjs --package-name '${{ steps.release-package.outputs.package_name }}' --package-version '${{ steps.release-package.outputs.package_version }}' --archive "$RUNNER_TEMP/release.tgz" --github-output "$GITHUB_OUTPUT"
      - name: Publish selected archive
        if: steps.published-release.outputs.published != 'true'
        run: npm publish "$RUNNER_TEMP/release.tgz" --access public --provenance
